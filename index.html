<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DeepSeek JSON Viewer: preview, search, and organize exported DeepSeek chats locally."
    />
    <meta name="theme-color" content="#f9fafb" />
    <script>
      // Keep these colors in sync with src/lib/theme.ts and src/styles/tokens.css.
      let storedTheme = null
      try {
        storedTheme = localStorage.getItem('dsjv:theme')
      } catch {
        // Storage can be unavailable; still honor the system preference.
      }
      const dark =
        storedTheme === 'dark' ||
        (storedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      const theme = dark ? 'dark' : 'light'
      document.documentElement.dataset.theme = theme
      document
        .querySelector('meta[name="theme-color"]')
        ?.setAttribute('content', dark ? '#151517' : '#f9fafb')

      // Set the language before first paint. Keep the supported list and the
      // English-prefix fallback in sync with src/lib/i18n/types.ts and resolveLocale.
      // Title/meta are localized after mount.
      let storedLocale = null
      try {
        storedLocale = localStorage.getItem('dsjv:locale')
      } catch {
        // Storage can be unavailable; still honor the browser language.
      }
      const validLocale = ['zh-CN', 'en'].includes(storedLocale) ? storedLocale : null
      const browserLanguages =
        navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language || '']
      document.documentElement.lang =
        validLocale ||
        (browserLanguages.some((language) => language.toLowerCase().startsWith('en'))
          ? 'en'
          : 'zh-CN')
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>DeepSeek JSON Viewer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
